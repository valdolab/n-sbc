[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsbc"
version = "1.2.2"
description = "n-SBC: A novel machine learning model"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    {name = "Osvaldo Velazquez", email = "osvaldodvego@gmail.com"},
]
keywords = ["machine-learning", "scikit-learn", "nsbc"]
dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.3.0",
    "tqdm>=4.60.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/valdolab/n-sbc"
Repository = "https://github.com/valdolab/n-sbc"
Issues = "https://github.com/valdolab/n-sbc/issues"

[project.optional-dependencies]
dev = ["pytest>=7.0.0", "pytest-cov>=4.0", "pre-commit>=3.0.0", "ruff>=0.4.0", "build>=0.10.0", "twine>=4.0.0"]
viz = ["matplotlib>=3.5.0", "plotly>=5.0.0", "pandas>=2.0.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    "examples",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C90",  # mccabe complexity
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "E203",  # whitespace before ':'
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["D100", "D101", "D102", "D103"]

[tool.ruff.lint.isort]
known-first-party = ["nsbc"]

[tool.ruff.lint.mccabe]
max-complexity = 10
