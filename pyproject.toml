[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nsbc"
version = "0.1.0"
description = "n-SBC: A novel machine learning model"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Osvaldo Velazquez", email = "osvaldodvego@gmail.com"},
]
keywords = ["machine-learning", "scikit-learn", "nsbc"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true

[tool.ruff]
target-version = "py310"
line-length = 88
exclude = [
    ".git",
    ".venv",
    "venv",
    "build",
    "dist",
    "__pycache__",
    "*.egg-info",
    ".pytest_cache",
    ".mypy_cache",
    "examples",
]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "I",    # isort
    "W",    # pycodestyle warnings
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "C90",  # mccabe complexity
]
ignore = [
    "E501",  # line-too-long (handled by formatter)
    "E203",  # whitespace before ':'
]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401", "F403"]
"tests/*" = ["D100", "D101", "D102", "D103"]

[tool.ruff.lint.isort]
known-first-party = ["nsbc"]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.poetry.dependencies]
numpy = "<2.0.0"
pandas = "^2.3.3"
tqdm = "^4.67.1"
matplotlib = "^3.10.7"
plotly = "^6.3.1"
scikit-learn = "^1.7.2"
